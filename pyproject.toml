[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oc-fleet"
version = "0.1.0"
description = "Fleet manager untuk OpenCode agents via HTTP API"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
oc-fleet = "cli:main"

[tool.setuptools]
py-modules = ["fleet", "endpoint", "ratelimit", "orchestrator", "prompt_lint", "config", "worktree", "cli"]
